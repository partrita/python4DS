name: Refresh security lockfile

on:
  push:
    branches:
      - security/dependabot-remediation

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Regenerate lockfile
        run: uv lock --upgrade
      - name: Export requirements
        run: uv export --format requirements-txt --output-file requirements.txt
      - name: Commit refreshed dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh dependency lockfile"
          git push
