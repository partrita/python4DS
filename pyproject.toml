[project]
name = "python4ds"
version = "1.0.4"
description = "The online book that teaches you how to use Python for data science."
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "authlib>=1.6.9",
    "beautifulsoup4>=4.12.3",
    "fastmcp>=3.4.7",
    "ghp-import>=2.1.0",
    "graphviz>=0.20.3",
    "h11>=0.16.0",
    "ibis-framework[sqlite]>=9.5.0",
    "ipykernel>=6.29.5",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "jupyter-book>=1.0.3",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.6.2",
    "joblib>=1.5.3",
    "lets-plot==4.5.2",
    "lxml>=6.1.0",
    "mcp>=2.0.0",
    "mistune>=3.3.4",
    "nbclient>=0.10.2",
    "nbconvert>=7.17.1",
    "nbstripout>=0.8.1",
    "notebook>=7.5.6",
    "numpy>=2.2.1",
    "openpyxl>=3.1.5",
    "palmerpenguins>=0.1.4",
    "pandas>=2.2.3",
    "pandas-datareader>=0.10.0",
    "pandas-profiling>=3.2.0",
    "pip>=24.3.1",
    "pillow>=12.3.0",
    "polars>=1.19.0",
    "pre-commit>=4.0.1",
    "pydantic-settings>=2.14.2",
    "pyarrow>=23.0.1",
    "pyarrow-hotfix>=0.7",  # ponytail: floor — 0.6 crashes on pyarrow>=21 (unregisters removed arrow.py_extension_type); drop when ibis drops the hotfix dep
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.2",
    "requests>=2.33.0",
    "rich>=13.9.4",
    "scipy>=1.15.0",
    "setuptools>=78.1.1,<84",  # ponytail: cap keeps pkg_resources for sphinxcontrib-bibtex/pybtex; drop when they migrate to importlib.metadata
    "skimpy>=0.0.17",
    "soupsieve>=2.8.4",
    "sqlalchemy>=1.4.39",
    "sqlmodel>=0.0.22",
    "starlette>=1.3.1",
    "statsmodels>=0.14.4",
    "toml>=0.10.2",
    "tornado>=6.5.6",
    "urllib3>=2.7.0",
    "virtualenv>=20.34.0",
    "watermark>=2.5.0",
]

[tool.ruff.lint]
ignore = ["F405", "F403"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
python4ds = { path = ".", editable = true }

[tool.pixi.tasks]
