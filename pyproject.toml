[project]
name = "python4ds"
version = "1.0.4"
description = "The online book that teaches you how to use Python for data science."
readme = "README.md"
requires-python = ">=3.10.0"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ghp-import>=2.1.0",
    "graphviz>=0.20.3",
    "ibis-framework[sqlite]>=9.5.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupyter-book>=1.0.3",
    "jupyterlab>=4.6.2",
    "lets-plot==4.5.2",
    "nbclient>=0.10.2",
    "nbstripout>=0.8.1",
    "numpy>=2.2.1",
    "openpyxl>=3.1.5",
    "palmerpenguins>=0.1.4",
    "pandas>=2.2.3",
    "pandas-datareader>=0.10.0",
    "pandas-profiling>=3.2.0",
    "pandasdmx>=1.10.0",
    "pip>=24.3.1",
    "pixi",
    "polars>=1.19.0",
    "pre-commit>=4.0.1",
    "pytest>=9.0.3",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "scipy>=1.15.0",
    "skimpy>=0.0.17",
    "sqlalchemy>=1.4.39",
    "sqlmodel>=0.0.22",
    "statsmodels>=0.14.4",
    "toml>=0.10.2",
    "watermark>=2.5.0",
]

# Security floors for transitive dependencies reported by Dependabot.
# Keep these as uv overrides so the application dependency surface does not
# change merely to constrain vulnerable transitive packages.
[tool.uv]
override-dependencies = [
    "authlib>=1.8.0",
    "fastmcp>=4.0.3",
    "fonttools>=4.60.2",
    "h11>=0.16.0",
    "idna>=3.15",
    "joblib>=1.6.0",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.6.2",
    "lxml>=6.1.0",
    "mistune>=3.3.0",
    "nbconvert>=7.17.1",
    "notebook>=7.5.6",
    "pillow>=12.3.0",
    "pyarrow>=20.0.0",
    "pyjwt>=2.12.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "setuptools>=78.1.1",
    "soupsieve>=2.8.4",
    "starlette>=1.0.1",
    "tornado>=6.5.6",
    "urllib3>=2.6.0",
    "wheel>=0.46.2",
]

[tool.ruff.lint]
ignore = ["F405", "F403"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
python4ds = { path = ".", editable = true }

[tool.pixi.tasks]
